data:
  duplicate_threshold: 0.9
  path: data/synthetic_transactions.csv
model:
  bert:
    base: aubmindlab/bert-base-arabertv02
    batch_size: 16
    epochs: 20
    focal_gamma: 2.0
    lora_r: 8
    lr: 0.0003
    max_length: 256
    patience: 4
  c_grid:
  - 0.5
  - 2.0
  - 8.0
  imbalance: weighted
  oversample_ratio: 0.5
  type: arabert
  use_department: false
output_dir: results
seed: 42
split:
  by_department: false
  n_splits: 5
  seed: 42
  val_fraction: 0.15
